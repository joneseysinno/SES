[workspace]
resolver = "3"
members = [
    "crates/ses-shell",
    "crates/ses-modules",
    "crates/ses-ui",
    "crates/ses-app",
]
default-members = ["crates/ses-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Jonesey's Innovation"]

[workspace.dependencies]
ses-shell = { path = "crates/ses-shell" }
ses-modules = { path = "crates/ses-modules" }
ses-ui = { path = "crates/ses-ui" }
infinite-db = "0.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
thiserror = "2"
dioxus = { version = "0.7", features = ["router"] }

[workspace.lints.rust]
unsafe_code = "forbid"
