[workspace]
resolver = "3"
members = [
    "crates/ses-core",
    "crates/ses-engineer",
    "crates/ses-adapter",
    "crates/ses-analysis",
    "crates/ses-provision",
    "crates/ses-shell",
    "crates/ses-modules",
    "crates/ses-ui",
    "crates/ses-app",
    "crates/departments",
]
default-members = ["crates/ses-app"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["Jonesey's Innovation"]

[workspace.dependencies]
adele-ring = "0.1.1"
infinite-db = "0.4.0"
ses-core = { path = "crates/ses-core" }
ses-engineer = { path = "crates/ses-engineer" }
ses-adapter = { path = "crates/ses-adapter" }
ses-analysis = { path = "crates/ses-analysis" }
ses-provision = { path = "crates/ses-provision" }
ses-shell = { path = "crates/ses-shell" }
ses-modules = { path = "crates/ses-modules" }
ses-ui = { path = "crates/ses-ui" }
departments = { path = "crates/departments" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
thiserror = "2"
dioxus = { version = "0.7", features = ["router"] }

[workspace.lints.rust]
unsafe_code = "forbid"
